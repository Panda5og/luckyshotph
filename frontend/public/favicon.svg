<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 8-ball gradient -->
  <defs>
    <radialGradient id="ballGradient" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" style="stop-color:#333333"/>
      <stop offset="70%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <radialGradient id="whiteCircle" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="80%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </radialGradient>
  </defs>
  
  <!-- Black ball -->
  <circle cx="16" cy="16" r="15" fill="url(#ballGradient)" stroke="#111" stroke-width="1"/>
  
  <!-- White circle for number -->
  <circle cx="16" cy="16" r="8" fill="url(#whiteCircle)"/>
  
  <!-- Number 8 -->
  <text x="16" y="20" font-family="Arial Black, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">8</text>
</svg>