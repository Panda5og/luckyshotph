<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/8ball.png" type="image/png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Lucky Shot Pool Hall Management System" />
        <style>
            /* Ensure dark background loads immediately */
            body {
                background-color: #1e293b !important;
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            }
            #root {
                min-height: 100vh;
                background-color: #1e293b;
            }
        </style>
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>Lucky Shot Pool Hall Management</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root">
            <!-- Fallback content while React loads -->
            <div style="min-height: 100vh; background-color: #1e293b; display: flex; align-items: center; justify-content: center; color: white; font-family: system-ui;">
                <div style="text-align: center;">
                    <div style="margin-bottom: 16px; font-size: 24px; font-weight: bold;">Lucky Shot Pool Hall</div>
                    <div style="margin-bottom: 16px;">Loading...</div>
                    <div style="width: 40px; height: 40px; border: 4px solid #374151; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                </div>
            </div>
        </div>
        <style>
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        
           
        <!-- PostHog analytics removed to prevent errors -->
        
        <!-- Watermark removal script -->
        <script>
            // Function to remove watermark elements
            function removeWatermarks() {
                // Common selectors for watermark elements
                const selectors = [
                    '[data-emergent-watermark]',
                    '[class*="emergent"]:not([class*="pool"]):not([class*="table"]):not([class*="player"]):not([class*="revenue"]):not([class*="daily"])',
                    '[id*="emergent"]:not([id*="pool"]):not([id*="table"]):not([id*="player"]):not([id*="revenue"]):not([id*="daily"])',
                    '*[title*="Made with Emergent"]',
                    '*[alt*="Made with Emergent"]',
                    'button[title*="Made with Emergent"]',
                    'a[title*="Made with Emergent"]'
                ];
                
                selectors.forEach(selector => {
                    try {
                        const elements = document.querySelectorAll(selector);
                        elements.forEach(el => {
                            if (el && el.parentNode) {
                                el.style.display = 'none';
                                el.style.visibility = 'hidden';
                                el.style.opacity = '0';
                                el.style.position = 'absolute';
                                el.style.left = '-9999px';
                                el.style.top = '-9999px';
                                el.setAttribute('hidden', 'true');
                            }
                        });
                    } catch (e) {
                        // Ignore errors for invalid selectors
                    }
                });
                
                // Remove elements that contain "Made with Emergent" text
                const allElements = document.querySelectorAll('*');
                allElements.forEach(el => {
                    if (el.textContent && el.textContent.toLowerCase().includes('made with emergent')) {
                        // Check if it's not part of our main application
                        if (!el.closest('#root')) {
                            el.style.display = 'none';
                        }
                    }
                });
            }
            
            // Run when DOM is loaded
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', removeWatermarks);
            } else {
                removeWatermarks();
            }
            
            // Run periodically to catch dynamically added elements
            setInterval(removeWatermarks, 2000);
            
            // Use MutationObserver to catch dynamically added elements
            try {
                if (window.MutationObserver) {
                    const observer = new MutationObserver(function(mutations) {
                        let shouldCheck = false;
                        mutations.forEach(function(mutation) {
                            if (mutation.addedNodes.length > 0) {
                                shouldCheck = true;
                            }
                        });
                        if (shouldCheck) {
                            setTimeout(removeWatermarks, 200);
                        }
                    });
                    
                    // Wait for body to be available
                    if (document.body) {
                        observer.observe(document.body, {
                            childList: true,
                            subtree: true
                        });
                    } else {
                        document.addEventListener('DOMContentLoaded', function() {
                            observer.observe(document.body, {
                                childList: true,
                                subtree: true
                            });
                        });
                    }
                }
            } catch (e) {
                console.log('MutationObserver setup failed:', e);
            }
        </script>
    </body>
</html>
